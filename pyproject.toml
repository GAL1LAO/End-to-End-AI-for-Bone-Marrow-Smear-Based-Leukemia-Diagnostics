[project]
name = "end-to-end-ai-for-bone-marrow-smear-based-leukemia-diagnostics"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    "bonemarrowwsi_pediatricleukemia",
    "data",
]

[tool.ruff.lint]
select = [
    "E4",  # Import errors
    "E7",  # Statement errors
    "E9",  # Runtime and syntax errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "B",   # Common bug patterns
    "UP",  # Modern Python syntax
]
